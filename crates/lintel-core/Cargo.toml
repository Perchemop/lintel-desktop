[package]
name = "lintel-core"
version = "0.8.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Lintel domain: walls, openings, snapping, project persistence and drawing-set PDF export. Pure Rust, headless-tested."
repository = "https://github.com/Perchemop/lintel-desktop"
readme = "../../README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
# Workflow tests use an isolated temporary directory (addendum K.11.4).
tempfile = "3"
