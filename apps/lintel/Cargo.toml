[package]
name = "lintel"
version = "0.19.0"
edition = "2024"

[dependencies]
# Core domain - pure Rust, headless tested
lintel-core = { path = "../../crates/lintel-core" }

# Shared suite infrastructure (guide section 7): crash capture + update check.
crash-report = { path = "../../crates/crash-report" }
update-check = { path = "../../crates/update-check" }

# GUI
eframe = { version = "=0.36" }
egui = { version = "=0.36" }

# Window icon: decode the embedded PNG for egui::IconData.
image = "0.25"

# SVG rasterization for the icon system (theme::icon_texture): original
# CAD-workflow SVGs in assets/icons/, rendered at exact pixel size with the
# same renderer egui_extras' SVG loader uses. Not an icon crate — no Lucide,
# Tabler, Phosphor or any packaged icon set (spec v0.20.0 AC-05, D-034).
resvg = "0.45"

[dev-dependencies]
# AccessKit / snapshot testing harness (guide II.27.12 / K.7)
egui_kittest = "0.36"
# Unit test helpers if needed
serde = { version = "1", features = ["derive"] }