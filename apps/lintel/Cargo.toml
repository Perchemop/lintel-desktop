[package]
name = "lintel"
version = "0.1.0"
edition = "2024"

[dependencies]
# Core domain - pure Rust, headless tested
lintel-core = { path = "../../crates/lintel-core" }

# GUI
eframe = { version = "=0.36" }
egui = { version = "=0.36" }

# Native file dialogs (blocking, fine for v0.1.0 open/save/export)
rfd = { version = "0.14", default-features = false, features = ["file-dialog"] }
tempfile = "3"

[dev-dependencies]
# Unit test helpers if needed
serde = { version = "1", features = ["derive"] }