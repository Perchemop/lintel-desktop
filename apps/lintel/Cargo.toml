[package]
name = "lintel"
version = "0.10.0"
edition = "2024"

[dependencies]
# Core domain - pure Rust, headless tested
lintel-core = { path = "../../crates/lintel-core" }

# Shared suite infrastructure (guide section 7): crash capture + update check.
crash-report = { path = "../../crates/crash-report" }
update-check = { path = "../../crates/update-check" }

# GUI
eframe = { version = "=0.36" }
egui = { version = "=0.36" }

# Window icon: decode the embedded PNG for egui::IconData.
image = "0.25"

[dev-dependencies]
# Unit test helpers if needed
serde = { version = "1", features = ["derive"] }