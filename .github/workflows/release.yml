name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: lintel-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: lintel-linux-aarch64
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: lintel-macos-aarch64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: lintel-windows-x86_64

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libxkbcommon-dev

    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        targets: ${{ matrix.target }}

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        key: ${{ matrix.target }}

    - name: Build release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build macOS app bundle
      id: bundle
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        APP="Lintel.app"
        rm -rf "$APP"
        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
        for cand in "target/${{ matrix.target }}/release/lintel"; do
          [ -f "$cand" ] && cp "$cand" "$APP/Contents/MacOS/lintel" && break
        done
        test -f "$APP/Contents/MacOS/lintel"
        chmod +x "$APP/Contents/MacOS/lintel"
        # Generate macOS .icns from SVG via iconutil (available on macOS runner)
        icns_path="$APP/Contents/Resources/lintel.icns"
        icon_svg="resources/icons/lintel.svg"
        if [ -f "$icon_svg" ]; then
          # Use iconutil to create multi-resolution icns from the SVG-generated PDF
          # First create a temp directory with the required icon file structure
          TMPDIR=$(mktemp -d)
          # Create the icon file at the required location for iconutil
          # iconutil expects @2x and @3x variants; we generate from the SVG source
          # Since we only have one SVG, create a 1024x1024 PDF then icns it
          # Actually, let's use a simpler approach: generate PNG sizes with sips/ImageMagick
          # and let iconutil wrap them. Fall back to embedding the PNG if iconutil fails.
          # Try iconutil first, fall back to PNG embedding
          # Create icon.iconset directory with required sizes
          mkdir -p "$TMPDIR/icon.iconset"
          # Generate 16x16, 32x32, 128x128, 256x256, 512x512 using sips (built into macOS)
          for size in 16 32 64 128 256 512; do
            sips -z $size $size "$icon_svg" --out "$TMPDIR/icon.iconset/icon_${size}x${size}.png" 2>/dev/null || true
          done
          # Also generate @2x variants where applicable
          sips -z 32 32 "$icon_svg" --out "$TMPDIR/icon.iconset/icon_16x16@2x.png" 2>/dev/null || true
          sips -z 64 64 "$icon_svg" --out "$TMPDIR/icon.iconset/icon_32x32@2x.png" 2>/dev/null || true
          sips -z 128 128 "$icon_svg" --out "$TMPDIR/icon.iconset/icon_64x64@2x.png" 2>/dev/null || true
          sips -z 256 256 "$icon_svg" --out "$TMPDIR/icon.iconset/icon_128x128@2x.png" 2>/dev/null || true
          sips -z 512 512 "$icon_svg" --out "$TMPDIR/icon.iconset/icon_256x256@2x.png" 2>/dev/null || true
          # Let iconutil create the .icns
          iconutil --convert icns "$TMPDIR/icon.iconset" --output "$icns_path" 2>/dev/null || \
          # Fall back: copy the raw PNG if iconutil unavailable or fails
          cp "$icon_svg" "$icns_path"
          rm -rf "$TMPDIR"
        fi
        # Set CFBundleIconFile so macOS picks up the .icns
        # The Info.plist already has CFBundleIconFile set below; ensure it references lintel
        # (The plist is written in the step below; we just need CFBundleIconFile)
        cat > "$APP/Contents/Info.plist" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key><string>Lintel</string>
          <key>CFBundleDisplayName</key><string>Lintel</string>
          <key>CFBundleExecutable</key><string>lintel</string>
          <key>CFBundleIdentifier</key><string>io.github.perchemop.lintel</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
          <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
          <key>LSMinimumSystemVersion</key><string>10.13</string>
          <key>NSHighResolutionCapable</key><true/>
          <key>NSPrincipalClass</key><string>NSApplication</string>
          <key>CFBundleIconFile</key><string>lintel</string>
        </dict>
        </plist>
        PLIST
        echo "bundle=$APP" >> "$GITHUB_OUTPUT"

    - name: Prepare artifact (${{ matrix.name }})
      shell: bash
      run: |
        set -euo pipefail
        STAGE="${{ matrix.asset }}"
        rm -rf "$STAGE" && mkdir -p "$STAGE"
        if [ "${{ runner.os }}" = "macOS" ]; then
          APP="${{ steps.bundle.outputs.bundle }}"
          test -d "$APP"
          cp -R "$APP" "$STAGE/"
        else
          BIN=""
          for cand in "target/${{ matrix.target }}/release/lintel" \
                      "target/${{ matrix.target }}/release/lintel.exe"; do
            if [ -f "$cand" ]; then BIN="$cand"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "no release binary found under target/${{ matrix.target }}/release" >&2
            exit 1
          fi
          cp "$BIN" "$STAGE/"
        fi
        cp README.md LICENSE-MIT LICENSE-APACHE ATTRIBUTION.md "$STAGE/" 2>/dev/null || true
        OUT="${{ matrix.asset }}.zip"
        rm -f "$OUT"
        if command -v zip >/dev/null 2>&1; then
          (cd "$STAGE" && zip -qr "../$OUT" .)
        else
          powershell.exe -NoProfile -Command \
            "Compress-Archive -Path '$STAGE' -DestinationPath '$OUT' -Force" \
            || powershell -NoProfile -Command \
            "Compress-Archive -Path '$STAGE' -DestinationPath '$OUT' -Force"
        fi
        test -f "$OUT"
        ls -la "$OUT"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.asset }}
        path: ${{ matrix.asset }}.zip
        if-no-files-found: error

    - name: Build Linux AppImage
      if: matrix.name == 'linux-x86_64'
      shell: bash
      run: |
        set -euo pipefail
        curl -L -o appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool
        # appimagetool is itself an AppImage and needs FUSE to run; extract it
        # and invoke the embedded AppRun ELF binary directly instead.
        ./appimagetool --appimage-extract
        BIN=""
        for cand in "target/${{ matrix.target }}/release/lintel"; do
          if [ -f "$cand" ]; then BIN="$cand"; break; fi
        done
        test -f "$BIN"
        rm -rf AppDir && mkdir -p AppDir/usr/bin
        cp "$BIN" AppDir/usr/bin/lintel
        chmod +x AppDir/usr/bin/lintel
        cp resources/linux/lintel.desktop AppDir/lintel.desktop
        cp resources/linux/lintel.png AppDir/lintel.png
        ./squashfs-root/AppRun AppDir lintel-appimage-x86_64.AppImage
        test -f lintel-appimage-x86_64.AppImage
        ls -la lintel-appimage-x86_64.AppImage

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: matrix.name == 'linux-x86_64'
      with:
        name: lintel-appimage-x86_64
        path: lintel-appimage-x86_64.AppImage
        if-no-files-found: error

    - name: Build Windows installer
      if: matrix.name == 'windows-x86_64'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # Chocolatey ships on windows-latest and is far more reliable than
        # fetching the Inno Setup installer directly (that download hung).
        choco install innosetup --no-progress -y
        $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
        if (!(Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
        if (!(Test-Path $iscc)) { throw "ISCC.exe not found after choco install" }
        # The .iss script references everything relative to its own directory.
        Expand-Archive -Path lintel-windows-x86_64.zip -DestinationPath resources\windows\staging -Force
        Copy-Item LICENSE-MIT resources\windows\LICENSE-MIT
        Push-Location resources\windows
        & $iscc lintel.iss
        Pop-Location
        Copy-Item resources\windows\output\lintel-windows-x86_64-setup.exe .
        if (!(Test-Path lintel-windows-x86_64-setup.exe)) {
          throw "lintel-windows-x86_64-setup.exe was not produced"
        }
        Get-ChildItem lintel-windows-x86_64-setup.exe

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: matrix.name == 'windows-x86_64'
      with:
        name: lintel-windows-x86_64-setup
        path: lintel-windows-x86_64-setup.exe
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build.result == 'success' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: recursive

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        merge-multiple: true

    - name: Collect artefacts and checksums
      id: collect
      run: |
        set -euo pipefail
        files=$(find dist -type f \( -name '*.zip' -o -name '*.AppImage' -o -name '*.exe' \) | sort)
        : > dist/SHA256SUMS.txt
        for f in $files; do
          (cd "$(dirname "$f")" && sha256sum "$(basename "$f")") >> dist/SHA256SUMS.txt
        done
        cat dist/SHA256SUMS.txt
        {
          echo "files<<EOF"
          for f in $files dist/SHA256SUMS.txt; do echo "$f"; done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Scan release assets for personal data (guide II.29.6)
      run: bash scripts/scan-release-assets.sh dist

    - name: Sign SHA256SUMS.txt (guide §12.1 auto-update security)
      if: ${{ github.ref_type == 'tag' }}
      shell: bash
      run: |
        set -euo pipefail
        # Guide §12.1: a release is signed or it does not ship (audit F3).
        # Refuse to publish unsigned rather than skipping silently.
        if [ -z "${GPG_PRIVATE_KEY:-}" ]; then
          echo "::error::GPG_PRIVATE_KEY is not set; refusing to publish an unsigned release"
          exit 1
        fi
        echo "${GPG_PRIVATE_KEY}" | gpg --import --batch --yes
        gpg --batch --yes --armor --detach-sign dist/SHA256SUMS.txt
        sig_check=$(gpg --verify dist/SHA256SUMS.txt.asc dist/SHA256SUMS.txt 2>&1 || true)
        echo "$sig_check"
        echo "$sig_check" | grep -q "Good signature" || {
          echo "::error::signature verification of SHA256SUMS.txt failed"
          exit 1
        }
        ls -la dist/SHA256SUMS.txt.asc
      env:
        GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

    - name: Verify tag matches crate version (audit F1)
      if: ${{ github.ref_type == 'tag' }}
      shell: bash
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME#v}"
        app=$(grep -m1 '^version' apps/lintel/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
        core=$(grep -m1 '^version' crates/lintel-core/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
        echo "tag=$tag apps/lintel=$app crates/lintel-core=$core"
        if [ "$tag" != "$app" ] || [ "$tag" != "$core" ]; then
          echo "::error::tag $tag does not match crate versions (app $app, core $core); bump before tagging"
          exit 1
        fi

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ARTEFACTS: ${{ steps.collect.outputs.files }}
      shell: bash
      run: |
        set -euo pipefail
        # One tag convention: the release is anchored to the real git tag
        # (`v…`). --verify-tag refuses to invent a tag (audit F4).
        ref="${GITHUB_REF_NAME}"
        tag="${GITHUB_REF_NAME#v}"
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          prerelease=()
          verify=(--verify-tag)
        else
          tag="dispatch-$(date -u +%Y%m%d-%H%M%S)"
          ref="$tag"
          prerelease=(--prerelease)
          verify=()
        fi
        if ! gh release view "$ref" >/dev/null 2>&1; then
          gh release create "$ref" ${verify[@]+"${verify[@]}"} --title "Lintel ${tag}" --notes-file RELEASE_NOTES.md "${prerelease[@]}"
        else
          echo "release $ref already exists; uploading assets"
        fi
        mapfile -t artefacts <<< "$ARTEFACTS"
        gh release upload "$ref" "${artefacts[@]}" --clobber
        gh release edit "$ref" --draft=false

    - name: Update docs/tokens.json ledger (guide §12.1)
      if: ${{ github.ref_type == 'tag' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME#v}"
        # Token count for this release: use RELEASE_TOKENS env var if set,
        # otherwise a conservative estimate (audit F8: warn — do not imply
        # the default is a measured value).
        if [ -z "${RELEASE_TOKENS:-}" ]; then
          echo "::warning::RELEASE_TOKENS not set; recording the 5000 default"
        fi
        release_tokens="${RELEASE_TOKENS:-5000}"
        git config user.name "Lintel Dev"
        git config user.email "dev@example.com"
        git fetch origin main
        git checkout main
        # Read current ledger. The pattern tolerates the space after the
        # colon that serde-style pretty JSON writes ("field": 5000).
        current=$(cat docs/tokens.json)
        total_before=$(echo "$current" | grep -oE '"total_tokens_since_start":[[:space:]]*[0-9]+' | grep -oE '[0-9]+')
        total_after=$((total_before + release_tokens))
        # Write updated ledger.
        printf '{"total_tokens_since_start": %d, "release_tokens": %d, "release_version": "%s", "_notes": "CI-managed ledger. Updated on each semver tag by the release workflow. Release notes must reference the values for the released version. See guide \\u00a712.1."}\n' "$total_after" "$release_tokens" "$tag" > docs/tokens.json
        git add docs/tokens.json
        git commit -m "ci: update tokens.json ledger for v$tag" || true
        git push origin main || true
