name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: lintel-linux-x86_64
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: lintel-linux-aarch64
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            asset: lintel-macos-aarch64
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: lintel-windows-x86_64

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
          libxkbcommon-dev

    - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        targets: ${{ matrix.target }}

    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        key: ${{ matrix.target }}

    - name: Build release
      run: cargo build --release --target ${{ matrix.target }}

    - name: Build macOS app bundle
      id: bundle
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        APP="Lintel.app"
        rm -rf "$APP"
        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
        for cand in "target/${{ matrix.target }}/release/lintel"; do
          [ -f "$cand" ] && cp "$cand" "$APP/Contents/MacOS/lintel" && break
        done
        test -f "$APP/Contents/MacOS/lintel"
        chmod +x "$APP/Contents/MacOS/lintel"
        cat > "$APP/Contents/Info.plist" <<PLIST
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>CFBundleName</key><string>Lintel</string>
          <key>CFBundleDisplayName</key><string>Lintel</string>
          <key>CFBundleExecutable</key><string>lintel</string>
          <key>CFBundleIdentifier</key><string>io.github.perchemop.lintel</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleShortVersionString</key><string>${GITHUB_REF_NAME#v}</string>
          <key>CFBundleVersion</key><string>${GITHUB_REF_NAME#v}</string>
          <key>LSMinimumSystemVersion</key><string>10.13</string>
          <key>NSHighResolutionCapable</key><true/>
          <key>NSPrincipalClass</key><string>NSApplication</string>
        </dict>
        </plist>
        PLIST
        echo "bundle=$APP" >> "$GITHUB_OUTPUT"

    - name: Prepare artifact (${{ matrix.name }})
      shell: bash
      run: |
        set -euo pipefail
        STAGE="${{ matrix.asset }}"
        rm -rf "$STAGE" && mkdir -p "$STAGE"
        if [ "${{ runner.os }}" = "macOS" ]; then
          APP="${{ steps.bundle.outputs.bundle }}"
          test -d "$APP"
          cp -R "$APP" "$STAGE/"
        else
          BIN=""
          for cand in "target/${{ matrix.target }}/release/lintel" \
                      "target/${{ matrix.target }}/release/lintel.exe"; do
            if [ -f "$cand" ]; then BIN="$cand"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "no release binary found under target/${{ matrix.target }}/release" >&2
            exit 1
          fi
          cp "$BIN" "$STAGE/"
        fi
        cp README.md LICENSE-MIT LICENSE-APACHE ATTRIBUTION.md "$STAGE/" 2>/dev/null || true
        OUT="${{ matrix.asset }}.zip"
        rm -f "$OUT"
        if command -v zip >/dev/null 2>&1; then
          (cd "$STAGE" && zip -qr "../$OUT" .)
        else
          powershell.exe -NoProfile -Command \
            "Compress-Archive -Path '$STAGE' -DestinationPath '$OUT' -Force" \
            || powershell -NoProfile -Command \
            "Compress-Archive -Path '$STAGE' -DestinationPath '$OUT' -Force"
        fi
        test -f "$OUT"
        ls -la "$OUT"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ matrix.asset }}
        path: ${{ matrix.asset }}.zip
        if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() && needs.build.result == 'success' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: dist
        merge-multiple: true

    - name: Collect artefacts and checksums
      id: collect
      run: |
        set -euo pipefail
        files=$(find dist -type f \( -name '*.zip' \) | sort)
        : > dist/SHA256SUMS.txt
        for f in $files; do
          (cd "$(dirname "$f")" && sha256sum "$(basename "$f")") >> dist/SHA256SUMS.txt
        done
        cat dist/SHA256SUMS.txt
        {
          echo "files<<EOF"
          for f in $files dist/SHA256SUMS.txt; do echo "$f"; done
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Scan release assets for personal data (guide II.29.6)
      run: bash scripts/scan-release-assets.sh dist

    - name: Publish GitHub release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ARTEFACTS: ${{ steps.collect.outputs.files }}
      shell: bash
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME#v}"
        if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
          prerelease=()
        else
          tag="dispatch-$(date -u +%Y%m%d-%H%M%S)"
          prerelease=(--prerelease)
        fi
        if ! gh release view "$tag" >/dev/null 2>&1; then
          gh release create "$tag" --title "Lintel ${tag}" --notes-file RELEASE_NOTES.md "${prerelease[@]}"
        else
          echo "release $tag already exists; uploading assets"
        fi
        mapfile -t artefacts <<< "$ARTEFACTS"
        gh release upload "$tag" "${artefacts[@]}" --clobber
        gh release edit "$tag" --draft=false
