name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: "true"

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # needed for whole-history scans

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: clippy, rustfmt

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-registry-${{ runner.os }}-

    - name: Cache Cargo git checkouts
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: cargo-index-${{ runner.os }}-
        restore-keys: |
          cargo-index-${{ runner.os }}-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy (no warnings)
      run: cargo clippy --all-targets --workspace -- -D warnings

    - name: Tests (headless, no display)
      run: cargo test --workspace

    - name: Build release (primary OS)
      run: cargo build --release

    - name: Upload release binary artefact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: lintel-linux-x86_64
        path: target/release/lintel

    - name: Secret scan (tracked files)
      run: bash scripts/scan-secrets.sh

    - name: Personal data scan (tracked files)
      run: bash scripts/scan-personal-data.sh

    - name: Cargo deny licence check
      uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      with:
        command: check
        arguments: --all-features --workspace

    - name: SBOM (dependency list)
      run: |
        cargo tree > docs/dependency-sbom.txt || echo "cargo-tree-unavailable" > docs/dependency-sbom.txt
