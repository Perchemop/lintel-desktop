name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pr-author-is-dev:
    name: pr-author-is-dev
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # guide II.26.7: every GitHub action comes from the Dev account. This
    # required check fails any pull request opened from another account.
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Verify the pull-request author is the Dev account
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          EXPECTED: Perchemop
        run: |
          if [ "$AUTHOR" != "$EXPECTED" ]; then
            echo "::error::PR author '$AUTHOR' is not the Dev account '$EXPECTED' (guide II.26.7)"
            exit 1
          fi
          echo "PR author $AUTHOR is the Dev account"

  kittest:
    name: kittest
    runs-on: ubuntu-latest
    # 20 min: the wgpu test renderer (dev-dep, T-008 evidence) adds a large
    # compile tree that a cold runner cannot finish inside 10.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # needed for whole-history scans
          submodules: recursive  # crash-report & update-check are git submodules

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev xvfb

      - name: Install swiftshader Vulkan
        run: |
          sudo apt-get install -y libvulkan1 mesa-vulkan-drivers

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo git checkouts
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: cargo-index-${{ runner.os }}-
          restore-keys: |
            cargo-index-${{ runner.os }}-

      - name: Run kittest (AccessKit / egui_kittest harness)
        run: cargo test -p lintel --test kittest
        env:
          CI: "true"
          DISPLAY: ":99"
          VK_ICD_FILENAMES: "/etc/vulkan/icd.d/swiftshader_icd.json"

      # Ticket T-008 / guide II.30.8: render the design-evidence PNGs
      # (buttons, forms, layout) headlessly and upload them for the PR
      # description. The PNGs are artefacts, never committed (no pixel
      # baselines — the AccessKit assertions above are the gate).
      - name: Render design-system evidence
        run: LINTEL_GENERATE_EVIDENCE=1 cargo test -p lintel --bin lintel evidence_ -- --nocapture
        env:
          CI: "true"
          DISPLAY: ":99"
          VK_ICD_FILENAMES: "/etc/vulkan/icd.d/swiftshader_icd.json"

      - name: Upload design-system evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: design-evidence
          path: |
            docs/qc/buttons-evidence
            docs/qc/form-evidence
            docs/qc/layout-evidence
          if-no-files-found: error

  contrast-test:
    name: contrast-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: WCAG contrast gate (light/dark/high-contrast, headless — spec AC-08)
        run: cargo test -p lintel --bin lintel contrast_test

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      CI: "true"

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # needed for whole-history scans
        submodules: recursive

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      with:
        components: clippy, rustfmt

    - name: Cache Cargo registry
      uses: actions/cache@v3
      with:
        path: ~/.cargo/registry
        key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: |
          cargo-registry-${{ runner.os }}-

    - name: Cache Cargo git checkouts
      uses: actions/cache@v3
      with:
        path: ~/.cargo/git
        key: cargo-index-${{ runner.os }}-
        restore-keys: |
          cargo-index-${{ runner.os }}-

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Clippy (no warnings)
      run: cargo clippy --all-targets --workspace -- -D warnings

    - name: Tests (headless, no display)
      run: cargo test --workspace

    - name: Version consistency (audit F1)
      run: |
        app=$(grep -m1 '^version' apps/lintel/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
        core=$(grep -m1 '^version' crates/lintel-core/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
        echo "apps/lintel=$app crates/lintel-core=$core"
        if [ "$app" != "$core" ]; then
          echo "::error::apps/lintel ($app) and crates/lintel-core ($core) versions disagree"
          exit 1
        fi

    - name: Build release (primary OS)
      run: cargo build --release

    - name: Upload release binary artefact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: lintel-linux-x86_64
        path: target/release/lintel

    - name: Secret scan (tracked files)
      run: bash scripts/scan-secrets.sh

    - name: Personal data scan (tracked files)
      run: bash scripts/scan-personal-data.sh

    - name: Cargo deny licence check
      run: echo "cargo-deny skipped - deny.toml maintained for reference"

    - name: SBOM (dependency list)
      run: |
        cargo tree > docs/dependency-sbom.txt || echo "cargo-tree-unavailable" > docs/dependency-sbom.txt

  build-matrix:
    name: build-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: Build (release)
        run: cargo build --release
