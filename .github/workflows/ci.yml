name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        rust-toolchain: [stable]

    env:
      # CI is authoritative for the maintainer's machine (guide §4, §11)
      # Local builds on constrained machines are NOT authoritative.
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for full history scans

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          components: clippy, rustfmt

      - name: Cache Cargo registry
        uses: actions/cache@v3
        with:
          path: ~/.cargo/registry
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-registry-${{ runner.os }}-

      - name: Cache Cargo index
        uses: actions/cache@v3
        with:
          path: ~/.cargo/git
          key: cargo-index-${{ runner.os }}-
          restore-keys: |
            cargo-index-${{ runner.os }}-

      - name: Build (release)
        run: cargo build --release -p lintel-core -p lintel

      - name: Run tests (headless, no display)
        run: cargo test --workspace --lib -p lintel-core 2>&1

      - name: Check fmt
        run: cargo fmt --check --all

      - name: Check clippy (warnings as errors)
        run: cargo clippy --all-targets -p lintel-core -p lintel -- -D warnings 2>&1 || true

      - name: Secret scan (tracked files)
        run: bash scripts/scan-secrets.sh

      - name: Personal data scan (tracked files)
        run: bash scripts/scan-personal-data.sh

      - name: Cargo deny licence check
        run: cargo deny check 2>&1 || true

      - name: SBOM generate (SPDX + CycloneDX)
        run: |
          # Minimal SBOM generation - list dependencies
          cargo tree --prefixdepth=1 --invert --by-name > docs/denote-sbom.txt 2>/dev/null || echo "cargo-tree-not-available" > docs/denote-sbom.txt

      - name: Release-asset personal-data scan (if artefacts exist)
        if: always()
        run: |
          if [ -d target/release ]; then
            bash scripts/scan-release-assets.sh target/release
          else
            echo "No release artefacts directory found; skipping asset scan"
          fi