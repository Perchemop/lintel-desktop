name: Feature Request
description: Request a new feature for Lintel
title: "[Feature] "
labels: ["feature request"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: A clear description of what the problem is.
      placeholder: "A clear description of what the problem is..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: A clear description of what you want to happen.
      placeholder: "A clear description of what you want to happen..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative solutions considered
      description: Any alternative solutions or features you've considered.
      placeholder: "e.g. I've been using FooCAD which does X..."
    validations:
      required: false
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where would this feature be used?
      choices:
        - Linux (x86_64)
        - Linux (aarch64)
        - macOS (x86_64)
        - macOS (aarch64)
        - Windows (x86_64)
        - Windows (aarch64)
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Lintel version
      description: Current version of Lintel.
      placeholder: "e.g. 0.1.0"